    <!-- Mobile Navigation JavaScript -->
    <script>
        // Select Elements
        const menuToggle = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('nav-menu');
        const menuOverlay = document.getElementById('menu-overlay');


        // Open and Close Menu
        function toggleMenu() {

            const isOpen = navMenu.classList.toggle('active');

            menuOverlay.classList.toggle('active', isOpen);

            document.body.classList.toggle('menu-open', isOpen);

            menuToggle.setAttribute('aria-expanded', isOpen);

        }


        // Close Menu
        function closeMenu() {

            navMenu.classList.remove('active');

            menuOverlay.classList.remove('active');

            document.body.classList.remove('menu-open');

            menuToggle.setAttribute('aria-expanded', 'false');

        }


        // Toggle Button Click
        menuToggle.addEventListener('click', toggleMenu);


        // Close Menu by Clicking Outside
        menuOverlay.addEventListener('click', closeMenu);


        // Close Menu After Clicking a Link
        const navLinks = document.querySelectorAll('.link-style');

        navLinks.forEach(function(link) {

            link.addEventListener('click', closeMenu);

        });


        // Close Menu by Pressing Escape
        document.addEventListener('keydown', function(event) {

            if (event.key === 'Escape') {
                closeMenu();
            }

        });
    </script>


    <!-- Statistics Count-Up Animation -->
    <script>
        const statNumbers = document.querySelectorAll(".stat-number");

        // ইংরেজি অঙ্ককে বাংলা অঙ্কে রূপান্তর
        function toBanglaNumber(number) {

            const banglaDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];

            return number.toString().replace(/\d/g, digit => banglaDigits[digit]);

        }


        // সংখ্যা ০ থেকে নির্দিষ্ট মান পর্যন্ত বাড়ানো
        function animateCount(element) {

            const target = Number(element.dataset.target);
            const duration = 1800;
            const startTime = performance.now();

            function updateCount(currentTime) {

                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const currentNumber = Math.floor(target * progress);

                element.textContent = toBanglaNumber(currentNumber);

                if (progress < 1) {
                    requestAnimationFrame(updateCount);
                } else {
                    element.textContent = toBanglaNumber(target);
                }

            }

            requestAnimationFrame(updateCount);

        }


        // Statistics Section স্ক্রিনে এলে অ্যানিমেশন চালু হবে
        const statisticsSection = document.querySelector(".statistics");

        const observer = new IntersectionObserver((entries) => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    statNumbers.forEach(number => animateCount(number));

                    observer.unobserve(entry.target);

                }

            });

        }, {
            threshold: 0.3
        });


        if (statisticsSection) {
            observer.observe(statisticsSection);
        }
    </script>
