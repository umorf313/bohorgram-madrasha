<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohorgram-Madrasha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <!-- Website Logo and Name -->
            <div class="logo">
                <img src="./images/logo.jpg" alt="Jamia Islamia Bohorgram Logo">
                <span>Jamia Islamia Bohorgram</span>
            </div>


            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menu-toggle"
                aria-label="Toggle Navigation Menu"
                aria-expanded="false">
                ☰
            </button>


            <!-- Navigation Menu -->
            <ul class="nav-style" id="nav-menu">

                <li><a class="link-style" href="./index.html">Home</a></li>

                <li><a class="link-style" href="./students.html">Students</a></li>

                <li><a class="link-style" href="">Teachers</a></li>

                <li><a class="link-style" href="">Exams Result</a></li>

                <li><a class="link-style" href="./photos.html">Photos</a></li>

                <li><a class="link-style" href="">Videos</a></li>

            </ul>


            <!-- Donation Button -->
            <button class="donate-button" id="donate-button">
                Donate
            </button>

        </nav>


        <!-- Background Overlay -->
        <div class="menu-overlay" id="menu-overlay"></div>


        <div class="banner">

            <h1>
                Jamia Islamia
                <span class="alada">Bohorgram</span>,
                Gulapganj, Sylhet
            </h1>

            <h3>A Model University in the World</h3>

        </div>

    </header>


    <main>

        <div class="main">

            <img src="images/cover pic.jpg" alt="Madrasha">
            <h3>Hostel</h3>

            <img src="images/madrasa.jpg" alt="Madrasha Building">
            <h3>Madrasha Building</h3>

            <img src="./images/muhtamin.jpeg" alt="Muhtamim">
            <h3>Muhtamim Saheb</h3>

        </div>

    </main>


    <footer class="footer">

        Jamia Islamia Bohorgram
        <br>
        Gulapganj, Sylhet.

    </footer>


    <!-- JavaScript -->
    <script>

        // Select Elements
        const menuToggle = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('nav-menu');
        const menuOverlay = document.getElementById('menu-overlay');


        // Open and Close Menu
        function toggleMenu() {

            const isOpen = navMenu.classList.toggle('active');

            menuOverlay.classList.toggle('active', isOpen);

            document.body.classList.toggle('menu-open', isOpen);

            menuToggle.setAttribute('aria-expanded', isOpen);

        }


        // Close Menu
        function closeMenu() {

            navMenu.classList.remove('active');

            menuOverlay.classList.remove('active');

            document.body.classList.remove('menu-open');

            menuToggle.setAttribute('aria-expanded', 'false');

        }


        // Toggle Button Click
        menuToggle.addEventListener('click', toggleMenu);


        // Close Menu by Clicking Outside
        menuOverlay.addEventListener('click', closeMenu);


        // Close Menu After Clicking a Link
        const navLinks = document.querySelectorAll('.link-style');

        navLinks.forEach(function(link) {

            link.addEventListener('click', closeMenu);

        });


        // Close Menu by Pressing Escape
        document.addEventListener('keydown', function(event) {

            if (event.key === 'Escape') {
                closeMenu();
            }

        });

    </script>

</body>

</html>
