<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohorgram-Madrasha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <!-- Website Logo and Name -->
            <div class="logo">
                <img src="./images/logo.jpg" alt="Jamia Islamia Bohorgram Logo">
                <span>Jamia Islamia Bohorgram</span>
            </div>


            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menu-toggle"
                aria-label="Open Navigation Menu"
                aria-expanded="false">
                ☰
            </button>


            <!-- Navigation Menu -->
            <ul class="nav-style" id="nav-menu">

                <li><a class="link-style" href="./index.html">Home</a></li>

                <li><a class="link-style" href="./students.html">Students</a></li>

                <li><a class="link-style" href="">Teachers</a></li>

                <li><a class="link-style" href="">Exams Result</a></li>

                <li><a class="link-style" href="./photos.html">Photos</a></li>

                <li><a class="link-style" href="">Videos</a></li>

            </ul>


            <!-- Donation Button -->
            <button class="donate-button" id="donate-button">
                Donate
            </button>

        </nav>


        <div class="banner">

            <h1>
                Jamia Islamia
                <span class="alada">Bohorgram</span>,
                Gulapganj, Sylhet
            </h1>

            <h3>A Model University in the World</h3>

        </div>

    </header>


    <main>

        <div class="main">

            <img src="images/cover pic.jpg" alt="Madrasha">
            <h3>Satrabash</h3>

            <img src="images/madrasa.jpg" alt="Madrasha Building">
            <h3>Madrasha Building</h3>

            <img src="./images/muhtamin.jpeg" alt="Muhtamin">
            <h3>Muhtamin Saheb</h3>

        </div>

    </main>


    <footer class="footer">

        Jamia Islamia Bohorgram
        <br>
        Gulapganj, Sylhet.

    </footer>


    <!-- JavaScript -->
    <script>

        // Select Menu Button
        const menuToggle = document.getElementById('menu-toggle');

        // Select Navigation Menu
        const navMenu = document.getElementById('nav-menu');


        // Open and Close Mobile Menu
        menuToggle.addEventListener('click', function() {

            navMenu.classList.toggle('active');

            const isOpen = navMenu.classList.contains('active');

            menuToggle.innerHTML = isOpen ? '✕' : '☰';

            menuToggle.setAttribute('aria-expanded', isOpen);

        });


        // Close Menu After Clicking a Navigation Link
        const navLinks = document.querySelectorAll('.link-style');

        navLinks.forEach(function(link) {

            link.addEventListener('click', function() {

                navMenu.classList.remove('active');

                menuToggle.innerHTML = '☰';

                menuToggle.setAttribute('aria-expanded', 'false');

            });

        });

    </script>

</body>

</html>
